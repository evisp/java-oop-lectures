# Every week must compile. The course pages promise that every code block
# runs as written, so a broken example fails here before a student finds it.
name: Compile

on: [push, workflow_dispatch]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          status=0
          for dir in week-*/ ; do
            files=$(ls "$dir"src/*.java 2>/dev/null) || continue
            echo "--- $dir"
            javac -d "$(mktemp -d)" $files || status=1
          done
          exit $status